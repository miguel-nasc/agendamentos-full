spring.application.name=pratica
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
logging.level.root=INFO
logging.file.name=logs/app.log
logging.logback.rollingpolicy.file-name-pattern=logs/app.log.%d{yyyy-MM-dd}.%i
logging.logback.rollingpolicy.max-history=5
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.clean-history-on-start=true

security.jwt.token.secret-key=${JWT_SECRET:secret-key}
security.jwt.token.expire-length=${JWT_EXPIRE_LENGTH:7200000}


