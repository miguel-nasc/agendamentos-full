# Configuração do banco H2 em memória (Modo de compatibilidade com PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Desativa o Flyway nos testes para acelerar a execução
spring.flyway.enabled=false

# Segredo JWT para o ambiente de testes (deve ter no mínimo 32 caracteres)
security.jwt.token.secret-key=sua-chave-secreta-muito-segura-com-pelo-menos-32-caracteres-12345